[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdtx"
version = "3.0.0"
description = "Agent-based Markdown translation pipeline with AST validation and placeholder protection."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "CrazyMayfly" }]
keywords = ["markdown", "translation", "llm", "agent", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "PyYAML~=6.0.2",
    "colorlog~=6.8.2",
    "markdown-it-py~=3.0.0",
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]
mcp = [
    "mcp>=1.2.0",
]
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
mdtx = "src.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/test"]

[tool.coverage.run]
source = ["src"]
omit = ["src/test/*", "src/buildtool/*"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# The codebase is untyped-by-annotation in places; this bar catches real
# attribute/argument mistakes (the OutputWriteError class of bug) without
# demanding full annotation coverage.
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tqdm.*", "tqdm", "PyInstaller.*", "PIL.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501", # line length handled by formatter threshold above; long prompts allowed
]

[tool.ruff.lint.per-file-ignores]
"src/buildtool/*" = ["E402"] # build scripts prepend sys.path before imports
