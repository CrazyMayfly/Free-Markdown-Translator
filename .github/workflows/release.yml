name: Release desktop app

# Tag push (v*) builds installers for macOS / Windows / Linux and publishes
# them to the GitHub release for that tag. workflow_dispatch builds artifacts
# without publishing (useful for testing the pipeline).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate: a tag cannot build installers unless the offline suite is green.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,mcp,dev]"

      - name: Ruff
        run: ruff check src

      - name: Pytest
        run: python -m pytest src/test -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Windows Defender flags unsigned PyInstaller onefile exes as malware
      # and quarantines the mdtx-api sidecar between build steps.
      - name: Disable Windows Defender real-time monitoring
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "$(Get-Location)" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "pyinstaller.exe" -ErrorAction SilentlyContinue
          Get-MpPreference | Select-Object DisableRealtimeMonitoring | Format-List

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui]" pyinstaller

      - name: Build mdtx-api sidecar
        run: python -m src.buildtool.build_api

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Verify sidecar binary
        shell: bash
        run: |
          ls -la ui/src-tauri/binaries/
          name="mdtx-api-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then name="$name.exe"; fi
          test -f "ui/src-tauri/binaries/$name" && echo "sidecar present: $name"

      - name: Build Tauri app
        working-directory: ui
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --target ${{ matrix.target }} 2>&1 | tee build-log.txt

      - name: Report build failure
        if: failure()
        working-directory: ui
        shell: bash
        run: |
          # Anonymous visitors cannot read job logs; surface the error tail as
          # check-run annotations so failures are diagnosable from the API.
          echo "--- binaries dir at failure time ---"
          ls -la src-tauri/binaries/ || true
          ls -la src-tauri/target/*/release/bundle/ 2>/dev/null || true
          {
            echo "binaries dir:"
            ls -la src-tauri/binaries/ 2>/dev/null
          } | sed 's/%/%25/g' | awk '{printf "%s\\n", $0}' | head -c 1500 > /tmp/ann.txt
          echo "::error title=sidecar dir::$(cat /tmp/ann.txt)"
          grep -vE "Compiling|Downloading|Downloaded|Blocking" build-log.txt | tail -c 4500 | sed 's/%/%25/g' | awk '{printf "%s\\n", $0}' | head -c 3800 > /tmp/ann2.txt
          echo "::error title=tauri build tail::$(cat /tmp/ann2.txt)"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          if-no-files-found: ignore
          path: ui/build-log.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdtx-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            ui/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # download-artifact keeps the bundle subdirectories (dmg/, nsis/,
          # deb/, appimage/), so match recursively.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          fail_on_unmatched_files: true
          body_path: .github/release-body.md
